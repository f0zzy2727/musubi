# musubi — fix the mouse-scroll "lock" in the agent panes.
#
# Symptom: scrolling a pane drops it into a mode you can only escape by mashing
# Enter. There are actually TWO different locks depending on the agent CLI's
# state, and this file fixes both:
#
#   Lock A — the AGENT's own pager. When an agent TUI has mouse reporting on
#   (tmux: #{mouse_any_flag}=1), tmux's default wheel binding FORWARDS the scroll
#   into the app. The app then drops into its own full-width "scrolled up" /
#   "(jump to forward)" bar across the bottom of the pane. tmux copy-mode never
#   triggers, so copy-mode bindings can't help — the only fix is to stop handing
#   the wheel to the app.
#
#   Lock B — tmux copy-mode. When the app has mouse reporting off, the wheel
#   enters tmux's own copy-mode (the yellow [x/y] box, top-right of the pane).
#   Trackpad momentum re-enters it faster than Escape can exit, so you mash keys.
#
# Part 1 (wheel routing) fixes Lock A: route the wheel to tmux copy-mode ALWAYS,
# never to the application. So you only ever land in tmux's own mode, never the
# agent's pager.
#
# Part 2 (exit hardening) fixes Lock B: a left-click / Enter / q cancels copy-mode
# on the first try; the click also focuses that pane (select-pane) so you can type
# to the agent immediately, even while momentum is still firing. Scroll-to-bottom
# still auto-exits via the `copy-mode -e` we enter with below.
#
# Sourced by orchestrator.py right after `set -g mouse on`. Covers both the emacs
# (default) and vi copy-mode key tables so it holds regardless of mode-keys.

# --- Part 1: route the wheel to tmux copy-mode, never the app's pager ---
bind-key -n WheelUpPane   if-shell -F "#{pane_in_mode}" "send-keys -X -N 3 scroll-up" "copy-mode -e ; send-keys -X -N 3 scroll-up"
bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -X -N 3 scroll-down"

# --- Part 2: harden copy-mode exit ---
bind-key -T copy-mode    MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T copy-mode    Enter          send-keys -X cancel
bind-key -T copy-mode    q              send-keys -X cancel

bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T copy-mode-vi Enter          send-keys -X cancel
bind-key -T copy-mode-vi q              send-keys -X cancel
