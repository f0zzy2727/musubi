[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musubi"
version = "0.2.0"
description = "Paired-LLM software engineering — two different-vendor models as colleagues, in tension, sharpening every cycle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LUGHa", email = "info@lugha.ie" }]
keywords = ["multi-agent", "llm", "ai-pair-programming", "claude", "codex", "code-review", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "libtmux>=0.55,<0.56",
  "pyyaml>=6.0",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
musubi = "orchestrator:main"

[project.urls]
Homepage = "https://github.com/f0zzy2727/musubi"
Source = "https://github.com/f0zzy2727/musubi"

# Flat layout: musubi's runtime is a handful of top-level modules plus the
# tmux launchers and scripts/ helpers (invoked by path, not installed as
# console scripts). List the importable modules explicitly so setuptools
# doesn't try to auto-discover packages in a non-package tree.
[tool.setuptools]
py-modules = ["orchestrator", "oyakata", "comms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
